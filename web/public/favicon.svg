<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" fill="#141412"/>
  <!-- Root line -->
  <line x1="4" y1="16" x2="14" y2="16" stroke="#F3EFE6" stroke-width="2" stroke-linecap="round"/>
  <!-- Upper split: Principal (ink / paper white) -->
  <path d="M14 16 C 18 16, 20 8, 28 8" stroke="#F3EFE6" stroke-width="2" stroke-linecap="round"/>
  <!-- Lower split: Coupon (vermilion) -->
  <path d="M14 16 C 18 16, 20 24, 28 24" stroke="#D9481C" stroke-width="2" stroke-linecap="round"/>
</svg>
